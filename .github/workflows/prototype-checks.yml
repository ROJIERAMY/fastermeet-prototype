name: Faster Meet prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: fastermeet-static-hosting
          path: dist/
          if-no-files-found: error
